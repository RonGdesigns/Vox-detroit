name: Domain Smoke

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  domain-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and run engine-independent smoke tests
        run: dotnet run --project tools/DomainSmoke/DomainSmoke.csproj --configuration Release

      - name: Validate committed Downtown Detroit map data
        run: python3 tools/osm/validate_downtown.py Assets/VoxDetroit/Data/downtown-core-prototype.json
